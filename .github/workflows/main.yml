name: Kernel Diff

on:
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-latest

    - name: Clone ACK android11-5.4-lts
      run: |
        git clone --depth=1 https://android.googlesource.com/kernel/common -b android11-5.4-lts ack-5.4

    - name: Clone ACK android12-5.10-lts
      run: |
        git clone --depth=1 https://android.googlesource.com/kernel/common -b android12-5.10-lts ack-5.10

    - name: Compare only include/ headers
      run: |
        mkdir diff-results
        diff -ruN ack-5.4/include ack-5.10/include > diff-results/include-changes.patch || true
        grep -E '^[+-][[:space:]]*(static|inline|extern|int|void|long|char|struct|bool)[^()]*\([^\)]*\)' diff-results/include-changes.patch \
          > diff-results/include-functions.txt || true

    - name: Upload diff artifact
      uses: actions/upload-artifact@v4
      with:
        name: ack-include-diff-5.4-vs-5.10
        path: diff-results/
