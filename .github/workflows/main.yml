name: Kernel Diff

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  diff:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone ACK android11-5.4-lts
      run: |
        git clone --depth=1 https://android.googlesource.com/kernel/common -b android11-5.4-lts ack-5.4

    - name: Clone ACK android12-5.10-lts
      run: |
        git clone --depth=1 https://android.googlesource.com/kernel/common -b android12-5.10-lts ack-5.10

    - name: Compare trees (functions/drivers/headers/codes)
      run: |
        mkdir diff-results
        diff -ruN ack-5.4 ack-5.10 > diff-results/ack-5.4-vs-5.10.patch || true
        grep -E '^[+-][[:space:]]*(static|int|void|long|char|struct|bool)[^()]*\([^\)]*\)' diff-results/ack-5.4-vs-5.10.patch \
          > diff-results/functions-changes.txt || true
        diff -ruN ack-5.4/include ack-5.10/include > diff-results/header-changes.patch || true
        diff -ruN ack-5.4/drivers ack-5.10/drivers > diff-results/driver-changes.patch || true

    - name: Upload diff artifact
      uses: actions/upload-artifact@v4
      with:
        name: ack-kernel-diff-5.4-vs-5.10
        path: diff-results/
